<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#800020"/>

  <!-- Gold ring -->
  <circle cx="32" cy="32" r="28" stroke="#D4AF37" stroke-width="2.5" fill="none"/>

  <!-- Ticket/token shape (rounded rect) -->
  <rect x="12" y="20" width="40" height="26" rx="5" ry="5" fill="#fff" opacity="0.95"/>

  <!-- Left notch -->
  <circle cx="12" cy="33" r="4" fill="#800020"/>
  <!-- Right notch -->
  <circle cx="52" cy="33" r="4" fill="#800020"/>

  <!-- Dashed divider line -->
  <line x1="16" y1="33" x2="48" y2="33" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Top text lines (simulated) -->
  <rect x="20" y="24" width="24" height="3" rx="1.5" fill="#800020" opacity="0.85"/>

  <!-- Token number area -->
  <rect x="18" y="36" width="28" height="6" rx="2" fill="#D4AF37" opacity="0.25"/>
  <!-- Token number text sim -->
  <rect x="22" y="37.5" width="20" height="3" rx="1.5" fill="#800020"/>
</svg>
